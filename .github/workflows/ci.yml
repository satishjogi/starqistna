name: CI

on:
  push:
    branches: [main, latest-working-files]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_TEST_URL: mongodb://localhost:27017
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: starqistna_ci
      JWT_SECRET: ci-secret
      STRIPE_API_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      BOOTSTRAP_ADMIN_PASSWORD: Str0ngPassw0rd!ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install pytest httpx
          pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Run backend tests
        working-directory: backend
        # Only the offline + MongoDB-backed suites: older tests in backend/tests
        # call a live deployment (REACT_APP_BACKEND_URL) and are run manually.
        run: >
          python -m pytest -q
          tests/test_phase1_hardening.py tests/test_phase2_payments.py
          tests/test_payment_finalization.py tests/test_stripe_webhook.py
          tests/test_issue_gohub_tickets.py tests/test_gohub_client.py
          tests/test_mongo_integration.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          CI=false npm run build
